<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - Gestão de Funcionários</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <h1>Bem-vindo!</h1>
    <p>Acesse o sistema de gestão de funcionários.</p>
    <form id="loginForm">
      <label>Usuário<input id="login" autocomplete="username" required></label>
      <label>Senha<input id="password" type="password" autocomplete="current-password" required></label>
      <button class="btn full" type="submit">Entrar</button>
      <p id="loginMessage" class="message" role="alert"></p>
    </form>
  </main>
  <script src="login.js"></script>
</body>
</html>
